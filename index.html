<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Weather Horizon | Precision Forecasts</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="img/logo@2x.png" alt="logo" width="40" class="me-2">
      <h5 class="mb-0">Weather<span>App</span></h5>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Forecast</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Radar</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container search-container">
  <div class="custom-search d-flex align-items-center">
    <input
      type="text"
      class="form-control"
      placeholder="Search city (e.g. Dubai, Tokyo...)"
      id="searchLocationInput"
    >
    <button class="btn btn-search" id="findWeatherBtn">Explore</button>
  </div>
</div>

<div class="container mt-5 mb-5">
  <div class="row g-4">

    <!-- Today -->
    <div class="col-lg-4">
      <div class="weather-card">
        <div class="card-header-date d-flex justify-content-between">
          <span><i class="far fa-calendar-alt me-2"></i><span id="nameToday">MONDAY</span></span>
          <span id="dateToday">16 OCT</span>
        </div>
        <div class="p-4">
          <h4 class="text-white-50 mb-1" id="cityName">London, UK</h4>
          <div class="d-flex align-items-center justify-content-between">
            <h2 class="temp-main" id="todayDgree">22°C</h2>
            <img src="img/116.png" alt="weather" class="weather-icon-lg" id="imgToday">
          </div>
          <p class="text-info fw-bold fs-5" id="weatherState">Clear Sky</p>
          <hr class="opacity-10">
          <div class="d-flex justify-content-between extra-info">
            <span><i class="fas fa-umbrella"></i> <span id="rain">12%</span></span>
            <span><i class="fas fa-wind"></i> <span id="wind">18km/h</span></span>
            <span><i class="fas fa-compass"></i> <span id="direction">East</span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Tomorrow -->
    <div class="col-lg-4">
      <div class="weather-card text-center">
        <div class="card-header-date" id="nameTomorow">TOMORROW</div>
        <div class="p-4">
          <img src="img/116.png" alt="weather" class="weather-icon-lg mb-3" id="imgTomorrow">
          <h2 class="mb-1 fw-bold" id="maximumTemperatureTomorrow">24°C</h2>
          <h4 class="text-white-50 mb-3" id="minimumTemperatureTomorrow">18°C</h4>
          <p class="text-info" id="weatherStateTomorrow">Partly Cloudy</p>
        </div>
      </div>
    </div>

    <!-- Day After Tomorrow -->
    <div class="col-lg-4">
      <div class="weather-card text-center">
        <div class="card-header-date" id="nextTomorrowDay">WEDNESDAY</div>
        <div class="p-4">
          <img src="img/116.png" alt="weather" class="weather-icon-lg mb-3" id="imgNextTomorrow">
          <h2 class="mb-1 fw-bold" id="maximumTemperatureNextTomorrow">26°C</h2>
          <h4 class="text-white-50 mb-3" id="minimumTemperatureNextTomorrow">19°C</h4>
          <p class="text-info" id="weatherStateNextTomorrow">Sunny</p>
        </div>
      </div>
    </div>

  </div>
</div>

<footer>
  <div class="container text-center">
    <div class="mb-4">
      <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
      <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
    </div>
    <p class="text-white-50 small">©️ 2026 Weather Horizon. Designed for clarity and precision.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="main.js"></script>
</body>
</html>
