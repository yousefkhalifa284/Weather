  <div class="container my-5">
    <div class="input-group rounded-pill ">
  <input type="text"  class="form-control  text-white rounded-start-pill border-0 py-3" placeholder="Find your location..." aria-label="Recipient’s username" aria-describedby="button-addon2">
  <button class="btn search-button text-white fw-semibold rounded-pill px-5 m-1" type="button" id="button-addon2">Find</button>
</div>
  </div>

  <div class="container mb-5">
    <div class="row g-0">
      <div class="col-md-4 weather-item">
      
          <div class="date d-flex justify-content-between py-2 px-1">
            <span id="nameToday"></span>
            <span id="dateToday"></span>
          </div>
          <div class="weather-content weather-hight">
            <h6 id="cityName" class="py-3 ms-3" ></h6>
            <h3 class="ms-3 pb-2" id="todayDgree"></h3>
            <img src="img/116.png" alt="weather state" class="img-fluid ms-4">
            <p class="ms-3 pb-4 weather-state" id="weatherState"></p>
            <div class="d-flex ms-3 pb-3">
              <img src="img/icon-umberella@2x.png" alt="umberella" class="img-fluid weather-img" >
              <span class="ms-2" id ="rain"></span>
              <img src="img/icon-wind@2x.png" alt="wind" class="img-fluid ms-3 weather-img">
              <span class="ms-2" id="wind"></span>
              <img src="img/icon-compass@2x.png" alt="compass " class="img-fluid ms-3 weather-img">
              <span class="ms-2" id="direction">East</span>
            </div>
          </div>
        </div>
      <div class="col-md-4 weather-item">
      
          <div class="date-tomorow text-center py-2 px-1">
            <span id="nameTomorow"></span>
          </div>
          <div class="weather-content-tomorow text-center weather-hight">
            <img src="img/116.png" alt="weather state" class="img-fluid mt-5" id="imgTomorrow">
            <h3 class="mt-3 pb-1 "id="maximumTemperatureTomorrow"></h3>
            <h4 class=" pb-2" id="minimumTemperatureTomorrow"></h4>
            <p class="mt-3 pb-4 weather-state" id="weatherStateTomorrow"></p>
          
          </div>
        </div>
      <div class="col-md-4 weather-item">
      
          <div class="date-next-tomorow text-center py-2 px-1">
            <span id="nextTomorrowDay"></span>
          </div>
          <div class="weather-content-tomorow weather-content-next-tomorow text-center weather-hight">
            <img src="img/116.png" alt="weather state" class="img-fluid mt-5" id ="imgNextTomorrow">
            <h3 class="mt-3 pb-1 " id="maximumTemperatureNextTomorrow"></h3>
            <h4 class=" pb-2" id="minimumTemperatureNextTomorrow"></h4>
            <p class="mt-3 pb-4 weather-state" id="weatherStateNextTomorrow"></p>
          
          </div>
        </div>

      </div>
    </div>
